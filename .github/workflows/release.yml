name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Use commit count as version for non-tag builds
            VERSION="1.0.$(git rev-list --count HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Create addon directory structure
        run: |
          mkdir -p PartyMacroManager
          cp Core.lua PartyMacroManager/
          cp Settings.lua PartyMacroManager/
          cp Settings_IconSelection.lua PartyMacroManager/
          cp Settings_CustomTexture.lua PartyMacroManager/
          cp Settings_ChatVerbosity.lua PartyMacroManager/
          cp PartyMacroManager.toc PartyMacroManager/
      
      - name: Create release zip
        run: |
          zip -r PartyMacroManager-${{ steps.get_version.outputs.VERSION }}.zip PartyMacroManager/
      
      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: PartyMacroManager-${{ steps.get_version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}