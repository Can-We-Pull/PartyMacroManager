name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get next version using conventional commits
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          noVersionBumpBehavior: current
          noNewCommitBehavior: current
        continue-on-error: true
          
      - name: Set version output
        id: version
        run: |
          if [ -z "${{ steps.semver.outputs.next }}" ]; then
            # No tags exist, start with 1.0.0
            VERSION="1.0.0"
          else
            # Remove 'v' prefix if present (semver-action may include it)
            VERSION="${{ steps.semver.outputs.next }}"
            VERSION="${VERSION#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Next version will be: $VERSION"
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Build addon with version
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh ${{ steps.version.outputs.VERSION }}
      
      - name: Rename zip with version
        run: |
          mv PartyMacroManager.zip PartyMacroManager-${{ steps.version.outputs.VERSION }}.zip
      
      - name: Commit version bump
        run: |
          git add src/PartyMacroManager.toc
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          files: PartyMacroManager-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}