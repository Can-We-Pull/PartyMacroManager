name: Code Review

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-lua:
    name: Lint Lua Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'package.json'

    - name: Install dependencies
      run: npm ci

    - name: Install LuaRocks and luacheck
      run: |
        sudo apt-get update
        sudo apt-get install -y luarocks lua5.1
        luarocks install --local luacheck
        echo "$HOME/.luarocks/bin" >> $GITHUB_PATH

    - name: Run Lua linter
      run: npm run lint:lua

    - name: Check for uncommitted Lua formatting changes
      run: |
        node scripts/lint-fix.mjs
        if ! git diff --exit-code src/; then
          echo "❌ Lua code formatting issues found. Run 'npm run lint:fix' locally and commit the changes."
          exit 1
        fi

  lint-javascript:
    name: Lint JavaScript Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'package.json'

    - name: Install dependencies
      run: npm ci

    - name: Run JavaScript linter
      run: npm run lint:js

    - name: Check for uncommitted JavaScript formatting changes
      run: |
        npm run lint:js:fix
        if ! git diff --exit-code scripts/; then
          echo "❌ JavaScript code formatting issues found. Run 'npm run lint:js:fix' locally and commit the changes."
          exit 1
        fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'package.json'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Generate coverage report
      run: npm run test:coverage
      continue-on-error: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
      continue-on-error: true
